<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>FRACTAL FORGE — Audio-Driven Infinite Zoom</title>
<style>
  html,body{margin:0;padding:0;background:#000;height:100%;overflow:hidden;font-family:'Segoe UI',system-ui,sans-serif}
  #gl{position:fixed;inset:0;width:100%;height:100%;display:block}
  #ui{position:fixed;left:0;right:0;bottom:0;padding:14px 16px;display:flex;gap:10px;align-items:center;
      flex-wrap:wrap;background:linear-gradient(transparent,rgba(0,0,10,.85));transition:opacity .4s;z-index:10}
  #ui.hidden{opacity:0;pointer-events:none}
  button,label.btn{padding:10px 14px;background:#0d0d1f;border:1px solid #2a2a55;border-radius:8px;color:#cfd0ff;
      font-size:13px;cursor:pointer;letter-spacing:.5px}
  button:hover,label.btn:hover{border-color:#7c4dff;color:#fff}
  #rec.recording{background:#3a0a14;border-color:#ff2d55;color:#ffccd5}
  #track{color:#8f90c0;font-size:12px;max-width:30vw;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  #time,#zoom{color:#565790;font-size:12px;font-variant-numeric:tabular-nums}
  #zoom{color:#9be8ff}
  select{background:#0d0d1f;color:#cfd0ff;border:1px solid #2a2a55;border-radius:8px;padding:9px;font-size:12px}
  #hint{position:fixed;top:14px;left:16px;color:#55578a;font-size:12px;z-index:10;transition:opacity .4s}
  #hint.hidden{opacity:0}
  #err{position:fixed;top:40%;left:50%;transform:translate(-50%,-50%);color:#ff2d55;font-size:14px;max-width:80vw;
       display:none;z-index:20;text-align:center}
</style>
</head>
<body>
<canvas id="gl"></canvas>
<div id="hint">FRACTAL FORGE · the audio drives the dive · SNAP saves a frame, RECORD exports video</div>
<div id="err"></div>
<div id="ui">
  <label class="btn">LOAD TRACK<input id="file" type="file" accept="audio/*" style="display:none"></label>
  <button id="play" disabled>PLAY</button>
  <button id="snap">SNAP</button>
  <button id="rec" disabled>RECORD</button>
  <select id="preset">
    <option value="0">NEBULA</option>
    <option value="1">INFERNO</option>
    <option value="2">ABYSS</option>
  </select>
  <select id="quality">
    <option value="720">720p</option>
    <option value="1080">1080p</option>
  </select>
  <span id="track">no track</span>
  <span id="time">00:00</span>
  <span id="zoom">x1e0.0</span>
</div>

<!-- ======================= SCENE: LOG-POLAR INFINITE FRACTAL ZOOM (HDR) ======================= -->
<script id="fs-scene" type="x-shader/x-fragment">#version 300 es
precision highp float;
out vec4 O;
uniform vec2  uRes;
uniform float uTime, uZoom, uSpin, uDrift, uBass, uMid, uTreble, uBeat, uFlux, uRMS, uDrop;
uniform int   uPreset;
vec3 palette(float t){
  if(uPreset==1) return 0.5+0.5*cos(6.28318*(t+vec3(0.00,0.05,0.10)));
  if(uPreset==2) return 0.5+0.5*cos(6.28318*(t+vec3(0.50,0.56,0.44)));
  return 0.5+0.5*cos(6.28318*(t+vec3(0.72,0.78,0.68)));
}
mat2 rot(float a){float c=cos(a),s=sin(a);return mat2(c,-s,s,c);}
void main(){
  vec2 uv = (2.0*gl_FragCoord.xy - uRes)/uRes.y;
  float r = max(length(uv), 1e-4);
  float a = atan(uv.y, uv.x);
  vec2 p = vec2(log(r), a);
  p.x -= uZoom;
  p.y += uSpin;
  p.y = mod(p.y + 3.14159, 6.28318) - 3.14159;
  float density = 2.2 + uTreble*0.9;
  p *= density;
  p.x += uDrift;
  vec2 q = p;
  float amp = 0.62;
  float f = 0.0;
  float ph = 0.0;
  for(int i=0;i<5;i++){
    q = abs(q) - (0.9 + uBass*0.35);
    q *= rot(0.42 + float(i)*0.55 + uMid*0.5);
    float ci = cos(q.x*0.85)*cos(q.y*0.85);
    f += amp * ci;
    ph += 0.14 + ci*0.10;
    q *= 1.42;
    amp *= 0.52;
  }
  float m = pow(clamp(abs(f)*1.7, 0.0, 1.0), 0.7);
  float qh = atan(q.y, q.x) / 6.28318;
  float hueClock = uTime*0.02 + uZoom*0.012 + float(uPreset)*0.33;
  vec3 base = palette(hueClock + 0.05 + m*0.32 + qh*0.25 + ph*0.35);
  base *= base * 2.6;
  vec3 col = base * (0.10 + 1.20*m*m);
  col += palette(hueClock + 0.15 + qh*0.2) * exp(-m*15.0) * (0.70 + uBeat*0.8 + uDrop*0.2);
  col += palette(hueClock + 0.02) * exp(-r*4.5) * (0.35 + uBeat*0.55);
  col += palette(hueClock + 0.22) * smoothstep(0.75, 0.0, r) * uFlux * 0.30;
  col *= 0.72 + uRMS*0.45;
  if(uPreset==1) col *= 1.15;
  if(uPreset==2) col *= 1.25;
  O = vec4(col, 1.0);
}
</script>

<!-- ======================= BRIGHT PASS ======================= -->
<script id="fs-bright" type="x-shader/x-fragment">#version 300 es
precision highp float;
out vec4 O;
uniform sampler2D tScene;
uniform vec2 uRes;
void main(){
  vec2 uv = gl_FragCoord.xy/uRes;
  vec3 c = texture(tScene, uv).rgb;
  float l = dot(c, vec3(0.2126,0.7152,0.0722));
  float soft = clamp(l - 0.85, 0.0, 4.0);
  O = vec4(c * (soft/(l+0.0001)), 1.0);
}
</script>

<!-- ======================= BLUR PASS ======================= -->
<script id="fs-blur" type="x-shader/x-fragment">#version 300 es
precision highp float;
out vec4 O;
uniform sampler2D tIn;
uniform vec2 uRes;
uniform vec2 uDir;
void main(){
  vec2 uv = gl_FragCoord.xy/uRes;
  vec3 c = texture(tIn, uv).rgb * 0.227027;
  c += texture(tIn, uv + uDir*1.3846).rgb * 0.316216;
  c += texture(tIn, uv - uDir*1.3846).rgb * 0.316216;
  c += texture(tIn, uv + uDir*3.2308).rgb * 0.070270;
  c += texture(tIn, uv - uDir*3.2308).rgb * 0.070270;
  O = vec4(c, 1.0);
}
</script>

<!-- ======================= COMPOSITE ======================= -->
<script id="fs-post" type="x-shader/x-fragment">#version 300 es
precision highp float;
out vec4 O;
uniform sampler2D tScene, tBloom;
uniform vec2 uRes;
uniform float uTime, uBeat, uKaleido, uDrop;

void main(){
  vec2 uv = gl_FragCoord.xy/uRes;
  vec2 c = uv - 0.5;
  c.x *= uRes.x/uRes.y;

  float a = atan(c.y, c.x);
  float r = length(c);
  float seg = 6.28318/6.0;
  float ka = mod(a, seg);
  ka = abs(ka - seg*0.5);
  vec2 kc = vec2(cos(ka), sin(ka)) * r;
  vec2 fuv = mix(c, kc, uKaleido);
  fuv.x /= uRes.x/uRes.y;
  fuv += 0.5;

  vec2 dir = fuv - 0.5;
  float ca = 0.0022 + uBeat*0.0045 + uDrop*0.0015;
  vec3 col;
  col.r = texture(tScene, fuv + dir*ca).r;
  col.g = texture(tScene, fuv).g;
  col.b = texture(tScene, fuv - dir*ca).b;

  vec3 bloom = texture(tBloom, fuv).rgb;
  col += bloom * (0.38 + uBeat*0.18 + uDrop*0.18);

  col = (col*(2.51*col+0.03))/(col*(2.43*col+0.59)+0.14);
  col *= 1.0 - 0.30*dot(c*0.62, c*0.62);
  float gr = fract(sin(dot(gl_FragCoord.xy+uTime*60.0, vec2(12.9898,78.233)))*43758.5453);
  col += (gr-0.5)*0.014;

  O = vec4(pow(max(col,0.0), vec3(0.4545)), 1.0);
}
</script>

<script>
"use strict";
const $=id=>document.getElementById(id);
const canvas=$("gl"), err=$("err");
function fail(msg){ err.style.display="block"; err.textContent=msg;
  window.__forge={ready:false,error:msg}; }
window.__forge={ready:false,frames:0};

const gl = canvas.getContext("webgl2",{antialias:false,alpha:false,preserveDrawingBuffer:true,depth:false});
if(!gl){ fail("WebGL2 not available on this device/browser"); throw new Error("no webgl2"); }
const floatExt = gl.getExtension("EXT_color_buffer_float");

function mkProg(fsId){
  const compile=(type,src)=>{const s=gl.createShader(type);gl.shaderSource(s,src);gl.compileShader(s);
    if(!gl.getShaderParameter(s,gl.COMPILE_STATUS)){fail("shader: "+gl.getShaderInfoLog(s));throw 0;}return s;};
  const p=gl.createProgram();
  gl.attachShader(p,compile(gl.VERTEX_SHADER,"#version 300 es\nin vec2 p;void main(){gl_Position=vec4(p,0.,1.);}"));
  gl.attachShader(p,compile(gl.FRAGMENT_SHADER,$(fsId).textContent));
  gl.linkProgram(p);
  if(!gl.getProgramParameter(p,gl.LINK_STATUS)){fail("link "+fsId+": "+gl.getProgramInfoLog(p));throw 0;}
  return p;
}
const progScene=mkProg("fs-scene"), progBright=mkProg("fs-bright"),
      progBlur=mkProg("fs-blur"), progPost=mkProg("fs-post");

const buf=gl.createBuffer();
gl.bindBuffer(gl.ARRAY_BUFFER,buf);
gl.bufferData(gl.ARRAY_BUFFER,new Float32Array([-1,-1,3,-1,-1,3]),gl.STATIC_DRAW);
function bindQuad(p){const loc=gl.getAttribLocation(p,"p");
  gl.enableVertexAttribArray(loc); gl.vertexAttribPointer(loc,2,gl.FLOAT,false,0,0);}
function U(p,n){return gl.getUniformLocation(p,n);}
const uS={res:U(progScene,"uRes"),time:U(progScene,"uTime"),zoom:U(progScene,"uZoom"),
  spin:U(progScene,"uSpin"),drift:U(progScene,"uDrift"),
  bass:U(progScene,"uBass"),mid:U(progScene,"uMid"),tre:U(progScene,"uTreble"),
  beat:U(progScene,"uBeat"),flux:U(progScene,"uFlux"),rms:U(progScene,"uRMS"),
  drop:U(progScene,"uDrop"),preset:U(progScene,"uPreset")};
const uB={scene:U(progBright,"tScene"),res:U(progBright,"uRes")};
const uBl={inp:U(progBlur,"tIn"),res:U(progBlur,"uRes"),dir:U(progBlur,"uDir")};
const uP={scene:U(progPost,"tScene"),bloom:U(progPost,"tBloom"),res:U(progPost,"uRes"),
  time:U(progPost,"uTime"),beat:U(progPost,"uBeat"),kaleido:U(progPost,"uKaleido"),drop:U(progPost,"uDrop")};

function mkTex(w,h,useFloat){
  const t=gl.createTexture(); gl.bindTexture(gl.TEXTURE_2D,t);
  if(useFloat) gl.texImage2D(gl.TEXTURE_2D,0,gl.RGBA16F,w,h,0,gl.RGBA,gl.HALF_FLOAT,null);
  else gl.texImage2D(gl.TEXTURE_2D,0,gl.RGBA8,w,h,0,gl.RGBA,gl.UNSIGNED_BYTE,null);
  gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MIN_FILTER,gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MAG_FILTER,gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_S,gl.CLAMP_TO_EDGE);
  gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_T,gl.CLAMP_TO_EDGE);
  return t;
}
function mkFBO(t){const f=gl.createFramebuffer();gl.bindFramebuffer(gl.FRAMEBUFFER,f);
  gl.framebufferTexture2D(gl.FRAMEBUFFER,gl.COLOR_ATTACHMENT0,gl.TEXTURE_2D,t,0);return f;}
let sceneTex,sceneFBO,bloomATex,bloomAFBO,bloomBTex,bloomBFBO,W=0,H=0,BW=0,BH=0;
let useFloatFBO = false; // half-float FBO sampling verified unreliable (SwiftShader white-screen); RGBA8 universal
function allocFB(){
  // PRO FIX: verify half-float FBO is actually COMPLETE on this GPU; verified
  // SwiftShader (and some real drivers) advertise the ext but produce garbage.
  for(let attempt=0; attempt<2; attempt++){
    sceneTex=mkTex(W,H,useFloatFBO); sceneFBO=mkFBO(sceneTex);
    if(gl.checkFramebufferStatus(gl.FRAMEBUFFER)===gl.FRAMEBUFFER_COMPLETE) break;
    useFloatFBO=false;
  }
  BW=Math.max(1,W>>2); BH=Math.max(1,H>>2);
  bloomATex=mkTex(BW,BH,useFloatFBO); bloomAFBO=mkFBO(bloomATex);
  bloomBTex=mkTex(BW,BH,useFloatFBO); bloomBFBO=mkFBO(bloomBTex);
}
let quality=720;
function resize(){
  const ar=innerWidth/innerHeight;
  H=quality; W=Math.round(quality*ar);
  canvas.width=W; canvas.height=H;
  gl.viewport(0,0,W,H);
  allocFB();
}
addEventListener("resize",resize); resize();
$("quality").onchange=e=>{quality=+e.target.value;resize();};

// ---- audio ----
let actx=null, analyser=null, srcNode=null, el=new Audio(), audioDest=null, freq=null;
let playing=false, beat=0, beatSmooth=0, flux=0, prevBins=null, lastBeatT=0, bassEma=0.05;
let bassSlow=0.05, midEma=0.05, treEma=0.05, drop=0, kaleido=0;
// ZOOM STATE — the audio writes these
let zoom=0, zoomKick=0, spin=0, drift=0;
el.crossOrigin="anonymous"; el.loop=false;

function initAudio(){
  if(actx) return;
  actx=new (window.AudioContext||window.webkitAudioContext)();
  analyser=actx.createAnalyser(); analyser.fftSize=2048; analyser.smoothingTimeConstant=0.55;
  srcNode=actx.createMediaElementSource(el);
  audioDest=actx.createMediaStreamDestination();
  srcNode.connect(analyser); analyser.connect(actx.destination); srcNode.connect(audioDest);
  freq=new Uint8Array(analyser.frequencyBinCount);
}
function bands(){
  analyser.getByteFrequencyData(freq);
  const avg=(a,b)=>{let s=0;for(let i=a;i<b;i++)s+=freq[i];return s/((b-a)*255);};
  return { bass:avg(1,7), mid:avg(9,85), tre:avg(86,470) };
}
function analyse(dt){
  const b=bands();
  bassEma=bassEma*0.995+b.bass*0.005;
  bassSlow=bassSlow*0.992+b.bass*0.008;
  midEma=midEma*0.98+b.mid*0.02;
  treEma=treEma*0.98+b.tre*0.02;
  const now=performance.now();
  if(b.bass>bassEma*1.45 && b.bass>0.28 && now-lastBeatT>240){
    beat=1; zoomKick+=0.55; lastBeatT=now;      // beat = inward whoosh
  }
  beat*=Math.pow(0.86, dt*60);
  beatSmooth=beatSmooth*0.9+beat*0.1;
  const dropTarget=(b.bass>0.5 && bassSlow>0.38)?1:0;
  drop += (dropTarget-drop)*(dropTarget>drop?0.04:0.012);
  const kTarget=Math.max(beatSmooth*0.5, drop);
  kaleido += (kTarget-kaleido)*0.08;
  if(prevBins){
    let f=0; for(let i=1;i<470;i++){const d=freq[i]-prevBins[i]; if(d>0)f+=d;}
    flux=flux*0.85+(f/470/255)*0.15;
  }
  prevBins=prevBins||new Uint8Array(freq.length);
  prevBins.set(freq);
  return b;
}

let objectUrl=null;
$("file").onchange=e=>{
  const f=e.target.files[0]; if(!f) return;
  initAudio();
  if(objectUrl)URL.revokeObjectURL(objectUrl);
  objectUrl=URL.createObjectURL(f);
  el.src=objectUrl;
  $("track").textContent=f.name;
  $("play").disabled=false; $("rec").disabled=false;
  $("play").textContent="PLAY";
};
$("play").onclick=async()=>{
  initAudio();
  if(actx.state==="suspended") await actx.resume();
  if(playing){ el.pause(); playing=false; $("play").textContent="PLAY"; }
  else{ await el.play(); playing=true; $("play").textContent="PAUSE"; }
};
el.onended=()=>{ playing=false; $("play").textContent="PLAY"; if(recording) stopRec(); };

// ---- EXPORT: chunked bridge on Android, blob download on desktop ----
function b64(buf){
  const bytes=new Uint8Array(buf); let s=""; const CH=0x8000;
  for(let i=0;i<bytes.length;i+=CH) s+=String.fromCharCode.apply(null, bytes.subarray(i,i+CH));
  return btoa(s);
}
async function exportBlob(blob, name){
  if(window.ForgeBridge){
    try{
      ForgeBridge.startFile(name, blob.type||"application/octet-stream");
      const CHUNK=1024*1024;
      for(let off=0; off<blob.size; off+=CHUNK){
        ForgeBridge.appendChunk(b64(await blob.slice(off,off+CHUNK).arrayBuffer()));
      }
      ForgeBridge.endFile();
      return;
    }catch(e){ /* fall through to browser path */ }
  }
  const a=document.createElement("a");
  a.href=URL.createObjectURL(blob); a.download=name;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(a.href),10000);
}
$("snap").onclick=()=>{
  canvas.toBlob(b=>{ if(b) exportBlob(b, "forge-frame-"+Date.now()+".png"); }, "image/png");
};

let recorder=null, chunks=[], recording=false;
function pickMime(){
  for(const m of ["video/webm;codecs=vp9,opus","video/webm;codecs=vp8,opus","video/webm"])
    if(window.MediaRecorder&&MediaRecorder.isTypeSupported(m)) return m;
  return "";
}
$("rec").onclick=()=>{ recording?stopRec():startRec(); };
function startRec(){
  if(!el.src) return;
  initAudio(); if(actx.state==="suspended") actx.resume();
  const stream=new MediaStream([
    ...canvas.captureStream(60).getVideoTracks(),
    ...audioDest.stream.getAudioTracks()
  ]);
  chunks=[];
  recorder=new MediaRecorder(stream,{mimeType:pickMime(),videoBitsPerSecond:14_000_000,audioBitsPerSecond:192_000});
  recorder.ondataavailable=e=>{if(e.data.size)chunks.push(e.data);};
  recorder.onstop=()=>{
    exportBlob(new Blob(chunks,{type:"webm"}), "fractal-zoom-"+Date.now()+".webm");
  };
  recorder.start(250);
  recording=true;
  $("rec").textContent="STOP + SAVE"; $("rec").classList.add("recording");
  if(!playing) $("play").click();
}
function stopRec(){
  if(recorder&&recorder.state!=="inactive") recorder.stop();
  recording=false;
  $("rec").textContent="RECORD"; $("rec").classList.remove("recording");
}

let uiTimer=null;
function pokeUI(){
  $("ui").classList.remove("hidden"); $("hint").classList.add("hidden");
  clearTimeout(uiTimer);
  uiTimer=setTimeout(()=>{ if(playing||recording) $("ui").classList.add("hidden"); },3000);
}
addEventListener("pointerdown",pokeUI); pokeUI();

// ---- render ----
const t0=performance.now();
let lastT=t0;
window.__forgeSet=(k,v)=>{ if(k==="bass")forcedBass=v; else if(k==="beat"){beatSmooth=beat=v;}
  else if(k==="drop")drop=v; else if(k==="kaleido")kaleido=v; else if(k==="zoom")zoom=v; };
let forcedBass=-1;
function frame(){
  const now=performance.now();
  const dt=Math.min((now-lastT)/1000,0.1); lastT=now;
  let b={bass:0,mid:0,tre:0}, rms=0;
  if(forcedBass>=0){ b={bass:forcedBass,mid:forcedBass*0.7,tre:forcedBass*0.5}; }
  else if(playing&&analyser){ b=analyse(dt); rms=b.bass*0.5+b.mid*0.35+b.tre*0.15; }
  else { beat*=0.9; beatSmooth*=0.9; flux*=0.9; kaleido*=0.97; drop*=0.99;
         midEma*=0.99; treEma*=0.99; }

  // ---- AUDIO -> ZOOM DIVE ----
  zoomKick *= Math.pow(0.25, dt);                       // kick decay
  zoom += dt*(0.06 + b.bass*0.55 + drop*0.40) + zoomKick*dt*3.0;
  spin += dt*(0.05 + flux*0.9) + beatSmooth*dt*0.3;
  drift += (midEma*1.6 - drift)*0.02;                   // mids choose the corridor

  const t=(now-t0)/1000;
  const preset=+$("preset").value;

  gl.bindFramebuffer(gl.FRAMEBUFFER,sceneFBO);
  gl.viewport(0,0,W,H);
  gl.useProgram(progScene); bindQuad(progScene);
  gl.uniform2f(uS.res,W,H); gl.uniform1f(uS.time,t);
  gl.uniform1f(uS.zoom,zoom); gl.uniform1f(uS.spin,spin); gl.uniform1f(uS.drift,drift);
  gl.uniform1f(uS.bass,b.bass); gl.uniform1f(uS.mid,b.mid); gl.uniform1f(uS.tre,b.tre);
  gl.uniform1f(uS.beat,beatSmooth); gl.uniform1f(uS.flux,flux*1.6);
  gl.uniform1f(uS.rms,rms); gl.uniform1f(uS.drop,drop); gl.uniform1i(uS.preset,preset);
  gl.drawArrays(gl.TRIANGLES,0,3);

  gl.bindFramebuffer(gl.FRAMEBUFFER,bloomAFBO);
  gl.viewport(0,0,BW,BH);
  gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D,sceneTex);
  gl.useProgram(progBright); bindQuad(progBright);
  gl.uniform1i(uB.scene,0); gl.uniform2f(uB.res,BW,BH);
  gl.drawArrays(gl.TRIANGLES,0,3);

  const blurPass=(srcTex,dstFBO,dx,dy)=>{
    gl.bindFramebuffer(gl.FRAMEBUFFER,dstFBO);
    gl.viewport(0,0,BW,BH);
    gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D,srcTex);
    gl.useProgram(progBlur); bindQuad(progBlur);
    gl.uniform1i(uBl.inp,0); gl.uniform2f(uBl.res,BW,BH);
    gl.uniform2f(uBl.dir,dx/BW,dy/BH);
    gl.drawArrays(gl.TRIANGLES,0,3);
  };
  blurPass(bloomATex,bloomBFBO,1,0);
  blurPass(bloomBTex,bloomAFBO,0,1);
  blurPass(bloomATex,bloomBFBO,1,0);
  blurPass(bloomBTex,bloomAFBO,0,1);

  gl.bindFramebuffer(gl.FRAMEBUFFER,null);
  gl.viewport(0,0,W,H);
  gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D,sceneTex);
  gl.activeTexture(gl.TEXTURE1); gl.bindTexture(gl.TEXTURE_2D,bloomATex);
  gl.useProgram(progPost); bindQuad(progPost);
  gl.uniform1i(uP.scene,0); gl.uniform1i(uP.bloom,1);
  gl.uniform2f(uP.res,W,H); gl.uniform1f(uP.time,t);
  gl.uniform1f(uP.beat,beatSmooth); gl.uniform1f(uP.kaleido,kaleido);
  gl.uniform1f(uP.drop,drop);
  gl.drawArrays(gl.TRIANGLES,0,3);
  gl.activeTexture(gl.TEXTURE0);

  window.__forge.frames++;
  window.__forge.ready=true;
  window.__dbg = {useFloat: useFloatFBO, W, H,
    gl,
    readScene(){ const px=new Uint8Array(4*4*4);
      gl.bindFramebuffer(gl.FRAMEBUFFER, sceneFBO);
      gl.readPixels(W/2,H/2,2,2,gl.RGBA,gl.UNSIGNED_BYTE,px);
      const px2=new Uint8Array(4*4*4);
      gl.readPixels(W-8,H-8,2,2,gl.RGBA,gl.UNSIGNED_BYTE,px2);
      gl.bindFramebuffer(gl.FRAMEBUFFER,null);
      return {center:[...px].slice(0,8), corner:[...px2].slice(0,8)};
    }};
  $("zoom").textContent="x1e"+(zoom/2.302585).toFixed(1);
  if(el.src){ const s=el.currentTime|0;
    $("time").textContent=String(s/60|0).padStart(2,"0")+":"+String(s%60).padStart(2,"0"); }
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
